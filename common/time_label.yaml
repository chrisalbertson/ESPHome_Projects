
# ============================================================
# TIME - per orologio
# ============================================================
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      then:
        - script.execute: update_time
    on_time:
      - seconds: 0
        then:
          - script.execute: update_time

# ============================================================
# SCRIPT
# ============================================================
script:
  - id: update_time
    then:
      - lvgl.label.update:
          id: lbl_time
          text:
            # See https://esphome.io/components/time/ for time_format
            time_format: "%a %I:%M %p"
